# The Julia interface: CNLPLib.jl (interfaces/CNLPLib.jl).
name: julia
on:
  push:
    branches: [main]
    paths: ["interfaces/CNLPLib.jl/**", ".github/workflows/julia.yml"]
  pull_request:
    paths: ["interfaces/CNLPLib.jl/**", ".github/workflows/julia.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1.10', '1']
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
        with:
          project: interfaces/CNLPLib.jl
      - uses: julia-actions/julia-runtest@v1
        with:
          project: interfaces/CNLPLib.jl
      - uses: julia-actions/julia-processcoverage@v1
        with:
          directories: interfaces/CNLPLib.jl/src,interfaces/CNLPLib.jl/ext
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          flags: julia
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ${{ github.repository }}
