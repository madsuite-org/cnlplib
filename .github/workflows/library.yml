# Build, check and publish a model package's cnlp library. Called from the package:
#
#   on:
#     push: { branches: [main], tags: ["v*"] }
#     pull_request:
#   jobs:
#     library:
#       uses: madsuite-org/cnlplib/.github/workflows/library.yml@main
#       with: { name: lv }
#       permissions: { contents: write }
#
# A package with many models can build them in parallel: `chunks: N` compiles N libraries
# (`libNAME_0.so` ...), one job each, and a last job joins them into one bundle whose
# `libNAME.so` lists the models and resolves each model's symbols into its chunk
# (scripts/assemble-chunks.sh), so the archive installs and loads as one library. The
# package's `compile_all` takes `chunk = (k, N)` and compiles the k-th of N parts.
#
# Each library is built once per backend: the host (CPU) build, published as
# NAME-linux-x86_64.tar.gz, and, with `device: cuda`, a build with the CUDA tier as well,
# NAME-linux-x86_64-cuda.tar.gz. `cnlp install` takes the one the machine supports.
#
# Every run builds and checks. A push to the default branch (or a manual run on it)
# replaces the assets of the package's rolling `nightly` release; a `v*` tag (TagBot's, on registration) attaches
# them to that version's release.
name: Library

on:
  workflow_call:
    inputs:
      name:
        description: Library name (lowercase), the one users install and resolve as @name
        required: true
        type: string
      device:
        description: '"cuda" to build the CUDA variant too (on a GPU runner), "" for the host build only'
        default: cuda
        type: string
      julia-version:
        # 1.13 or newer: on 1.11 and 1.12 PrettyTables 3 (through NLPModels and
        # TimerOutputs) loads REPL, and with Pkg also loaded (LazyArtifacts) Pkg's REPL
        # extension is in the image, which `juliac --trim` refuses.
        default: "1.13.4"
        type: string
      runs-on:
        description: Runner labels for the device builds, as JSON
        default: '["self-hosted", "gpu", "cuda", "shin-compute"]'
        type: string
      cpu-runs-on:
        description: Runner labels for the host builds, as JSON (no GPU needed)
        default: '["self-hosted", "shin-compute"]'
        type: string
      examodelscompiler-rev:
        description: Take ExaModelsCompiler from this ExaModels.jl revision instead of the registry
        default: ""
        type: string
      check-size:
        description: Size at which models sized by one integer are checked
        default: "10"
        type: string
      chunks:
        description: Number of parallel chunk builds joined into one library ("1" for one build)
        default: "1"
        type: string
      cnlplib-ref:
        description: The cnlplib revision whose scripts the jobs run (the one this workflow is called at)
        default: main
        type: string
      max-ptx:
        description: Newest PTX ISA a device build may carry (8.1 is CUDA 12.1's, what ExaModelsCompiler 0.4.3 emits; a driver older than the ISA cannot load the kernels)
        default: "8.1"
        type: string

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      chunks: ${{ steps.plan.outputs.chunks }}
      variants: ${{ steps.plan.outputs.variants }}
    steps:
      - id: plan
        env:
          DEVICE: ${{ inputs.device }}
          GPU: ${{ inputs.runs-on }}
          CPU: ${{ inputs.cpu-runs-on }}
        run: |
          echo "chunks=$(seq 0 $(( ${{ inputs.chunks }} - 1 )) | jq -sc 'map(tostring)')" >> "$GITHUB_OUTPUT"
          # one build per backend: the host build, and the device build if asked for
          v=$(jq -nc --arg cpu "$CPU" '[{name: "cpu", device: "", platform: "linux-x86_64", runs: $cpu}]')
          [ -z "$DEVICE" ] || v=$(echo "$v" | jq -c --arg d "$DEVICE" --arg gpu "$GPU" \
              '. + [{name: $d, device: $d, platform: ("linux-x86_64-" + $d), runs: $gpu}]')
          echo "variants=$v" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: inputs.chunks == '1'
    runs-on: ${{ fromJSON(matrix.variant.runs) }}
    strategy:
      matrix:
        variant: ${{ fromJSON(needs.plan.outputs.variants) }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # Self-hosted runners keep the workspace between runs: start empty, or a file an
      # earlier run left (an older build's archive) is packed and published with this one.
      - name: Empty the workspace
        run: find . -mindepth 1 -delete
      - uses: actions/checkout@v5
        with:
          path: package
      - uses: actions/checkout@v5
        with:
          repository: madsuite-org/cnlplib
          ref: ${{ inputs.cnlplib-ref }}
          path: cnlplib
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ inputs.julia-version }}
      - name: Version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            v="${GITHUB_REF_NAME#v}"
            p=$(sed -n 's/^version = "\(.*\)"$/\1/p' package/Project.toml)
            [ "$v" = "$p" ] || { echo "tag $GITHUB_REF_NAME, but Project.toml says $p"; exit 1; }
          else
            v=nightly
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Build
        env:
          EXAMODELSCOMPILER_REV: ${{ inputs.examodelscompiler-rev }}
        run: julia --startup-file=no cnlplib/scripts/build-library.jl package "${{ inputs.name }}" build ${{ matrix.variant.device }}
      - name: Check
        run: julia --startup-file=no cnlplib/scripts/check-library.jl "build/${{ inputs.name }}/lib/lib${{ inputs.name }}.so" "${{ inputs.check-size }}"
      - name: PTX ISA of the device code
        if: matrix.variant.device != ''
        run: sh cnlplib/scripts/check-ptx.sh "build/${{ inputs.name }}" "${{ inputs.max-ptx }}"
      - name: Package
        run: cnlplib/scripts/package-library.sh "build/${{ inputs.name }}" "${{ inputs.name }}" "${{ steps.version.outputs.version }}" "${{ matrix.variant.platform }}" package/LICENSE "${{ matrix.variant.device }}"
      - name: Load it in a plain C process
        run: |
          cc -std=c99 -O2 -o smoke cnlplib/scripts/smoke.c -ldl -lm
          mkdir unpacked && tar -xzf "${{ inputs.name }}-${{ matrix.variant.platform }}.tar.gz" -C unpacked
          # as installed: the official Julia runtime (setup-julia's) linked in
          sh cnlplib/scripts/link-artifacts.sh "unpacked/${{ inputs.name }}"
          env -i PATH=/usr/bin:/bin ./smoke "unpacked/${{ inputs.name }}/lib/lib${{ inputs.name }}.so" "${{ inputs.check-size }}"
      - name: Sources of the GPL and LGPL libraries in the runtime
        # once per release: every variant carries the same runtime
        if: matrix.variant.name == 'cpu'
        run: sh cnlplib/scripts/gpl-sources.sh "$(sed -n 's/^julia = //p' unpacked/${{ inputs.name }}/VERSION)" . "${{ inputs.name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.name }}-library-${{ matrix.variant.name }}
          # this variant's archive by its exact name (each variant's artifact lands in one
          # directory at publish, where two files of one name would overwrite each other)
          path: |
            ${{ inputs.name }}-${{ matrix.variant.platform }}.tar.gz
            ${{ inputs.name }}-sources-gpl.tar

  chunk:
    needs: plan
    if: inputs.chunks != '1'
    runs-on: ${{ fromJSON(matrix.variant.runs) }}
    strategy:
      fail-fast: true
      matrix:
        chunk: ${{ fromJSON(needs.plan.outputs.chunks) }}
        variant: ${{ fromJSON(needs.plan.outputs.variants) }}
    steps:
      # Self-hosted runners keep the workspace between runs: start empty, or a file an
      # earlier run left (an older build's archive) is packed and published with this one.
      - name: Empty the workspace
        run: find . -mindepth 1 -delete
      - uses: actions/checkout@v5
        with:
          path: package
      - uses: actions/checkout@v5
        with:
          repository: madsuite-org/cnlplib
          ref: ${{ inputs.cnlplib-ref }}
          path: cnlplib
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ inputs.julia-version }}
      - name: Build chunk ${{ matrix.chunk }}
        env:
          EXAMODELSCOMPILER_REV: ${{ inputs.examodelscompiler-rev }}
          CNLP_CHUNK: ${{ matrix.chunk }}/${{ inputs.chunks }}
        run: julia --startup-file=no cnlplib/scripts/build-library.jl package "${{ inputs.name }}" build ${{ matrix.variant.device }}
      - name: Pack the chunk
        # without share/: the artifacts juliac bundles there (pocl alone is ~300 MB) are not
        # packed into the library, so carrying them to the join only costs time
        run: tar -C build --exclude "${{ inputs.name }}_${{ matrix.chunk }}/share" -cf "chunk-${{ matrix.chunk }}.tar" "${{ inputs.name }}_${{ matrix.chunk }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.name }}-chunk-${{ matrix.variant.name }}-${{ matrix.chunk }}
          path: chunk-${{ matrix.chunk }}.tar
          retention-days: 1

  assemble:
    needs: [plan, chunk]
    runs-on: ${{ fromJSON(matrix.variant.runs) }}
    strategy:
      matrix:
        variant: ${{ fromJSON(needs.plan.outputs.variants) }}
    steps:
      # Self-hosted runners keep the workspace between runs: start empty, or a file an
      # earlier run left (an older build's archive) is packed and published with this one.
      - name: Empty the workspace
        run: find . -mindepth 1 -delete
      - uses: actions/checkout@v5
        with:
          path: package
      - uses: actions/checkout@v5
        with:
          repository: madsuite-org/cnlplib
          ref: ${{ inputs.cnlplib-ref }}
          path: cnlplib
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ inputs.julia-version }}
      - name: Version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            v="${GITHUB_REF_NAME#v}"
            p=$(sed -n 's/^version = "\(.*\)"$/\1/p' package/Project.toml)
            [ "$v" = "$p" ] || { echo "tag $GITHUB_REF_NAME, but Project.toml says $p"; exit 1; }
          else
            v=nightly
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ inputs.name }}-chunk-${{ matrix.variant.name }}-*
          path: chunks
          merge-multiple: true
      - name: Join the chunks
        run: |
          mkdir -p build/chunks
          for t in chunks/chunk-*.tar; do tar -C build/chunks -xf "$t" && rm "$t"; done
          sh cnlplib/scripts/assemble-chunks.sh "${{ inputs.name }}" "build/${{ inputs.name }}" build/chunks/${{ inputs.name }}_*
      - name: Check
        run: julia --startup-file=no cnlplib/scripts/check-library.jl "build/${{ inputs.name }}/lib/lib${{ inputs.name }}.so" "${{ inputs.check-size }}"
      - name: PTX ISA of the device code
        if: matrix.variant.device != ''
        run: sh cnlplib/scripts/check-ptx.sh "build/${{ inputs.name }}" "${{ inputs.max-ptx }}"
      - name: Package
        run: cnlplib/scripts/package-library.sh "build/${{ inputs.name }}" "${{ inputs.name }}" "${{ steps.version.outputs.version }}" "${{ matrix.variant.platform }}" package/LICENSE "${{ matrix.variant.device }}"
      - name: Load it in a plain C process
        run: |
          cc -std=c99 -O2 -o smoke cnlplib/scripts/smoke.c -ldl -lm
          mkdir unpacked && tar -xzf "${{ inputs.name }}-${{ matrix.variant.platform }}.tar.gz" -C unpacked
          # as installed: the official Julia runtime (setup-julia's) linked in
          sh cnlplib/scripts/link-artifacts.sh "unpacked/${{ inputs.name }}"
          env -i PATH=/usr/bin:/bin ./smoke "unpacked/${{ inputs.name }}/lib/lib${{ inputs.name }}.so" "${{ inputs.check-size }}"
      - name: Sources of the GPL and LGPL libraries in the runtime
        # once per release: every variant carries the same runtime
        if: matrix.variant.name == 'cpu'
        run: sh cnlplib/scripts/gpl-sources.sh "$(sed -n 's/^julia = //p' unpacked/${{ inputs.name }}/VERSION)" . "${{ inputs.name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.name }}-library-${{ matrix.variant.name }}
          # this variant's archive by its exact name (each variant's artifact lands in one
          # directory at publish, where two files of one name would overwrite each other)
          path: |
            ${{ inputs.name }}-${{ matrix.variant.platform }}.tar.gz
            ${{ inputs.name }}-sources-gpl.tar

  publish:
    needs: [build, assemble]
    if: >-
      always() && contains(needs.*.result, 'success') && !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref_type == 'tag' || github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ inputs.name }}-library-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum -- *.tar.gz > SHA256SUMS && cat SHA256SUMS
      - name: Versioned release
        if: github.ref_type == 'tag'
        run: |
          gh release view "$GITHUB_REF_NAME" -R "$REPO" > /dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" -R "$REPO" --verify-tag --title "$GITHUB_REF_NAME" --notes ""
          gh release upload "$GITHUB_REF_NAME" -R "$REPO" --clobber dist/*.tar.gz dist/*.tar dist/SHA256SUMS
      - name: Nightly release
        if: github.ref_type != 'tag'
        run: |
          # move the `nightly` tag to this commit, then replace the release's assets
          gh api -X PATCH "repos/$REPO/git/refs/tags/nightly" -f sha="$GITHUB_SHA" -F force=true > /dev/null 2>&1 ||
            gh api -X POST "repos/$REPO/git/refs" -f ref=refs/tags/nightly -f sha="$GITHUB_SHA" > /dev/null
          notes="Built from $GITHUB_SHA on $(date -u +%Y-%m-%d). Install: cnlp install ${{ inputs.name }}@nightly"
          if gh release view nightly -R "$REPO" > /dev/null 2>&1; then
            gh release edit nightly -R "$REPO" --prerelease --notes "$notes"
          else
            gh release create nightly -R "$REPO" --prerelease --title "Nightly" --notes "$notes"
          fi
          gh release upload nightly -R "$REPO" --clobber dist/*.tar.gz dist/*.tar dist/SHA256SUMS
          # an artifact this build no longer uses (its name has its content hash) is dropped
          gh release view nightly -R "$REPO" --json assets -q '.assets[].name' | { grep '\.artifact\.tar\.gz$' || true; } |
            while read -r a; do [ -e "dist/$a" ] || gh release delete-asset nightly "$a" -R "$REPO" -y; done
