# The Python interface: the cnlplib package (interfaces/cnlplib-py).
name: python
on:
  push:
    branches: [main]
    paths: ["interfaces/cnlplib-py/**", ".github/workflows/python.yml"]
  pull_request:
    paths: ["interfaces/cnlplib-py/**", ".github/workflows/python.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: interfaces/cnlplib-py
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[solve]" scipy pytest pytest-cov "ruff==0.16.2"
      - run: ruff check .
      - run: pytest -q --cov=cnlplib --cov-report=xml
      - uses: codecov/codecov-action@v5
        with:
          files: interfaces/cnlplib-py/coverage.xml
          flags: python
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ${{ github.repository }}
