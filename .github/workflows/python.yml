# The Python interface: the cnlplib package (interfaces/cnlplib-py).
name: python
on:
  push:
    branches: [main]
    paths: ["interfaces/cnlplib-py/**", ".github/workflows/python.yml"]
  pull_request:
    paths: ["interfaces/cnlplib-py/**", ".github/workflows/python.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: interfaces/cnlplib-py
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # HDF5's development files build libcnlpio for the solution-file tests
      - run: sudo apt-get update -q && sudo apt-get install -y -q libhdf5-dev pkg-config
      - run: pip install -e ".[test]" h5py "ruff==0.16.2"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q --cov=cnlplib --cov-report=xml
      - uses: codecov/codecov-action@v5
        with:
          files: interfaces/cnlplib-py/coverage.xml
          flags: python
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ${{ github.repository }}

  # the package as it is distributed: sdist and wheel build, their metadata checks, and the
  # tests run against the installed wheel rather than the source tree
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: interfaces/cnlplib-py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - run: |
          python -m venv /tmp/wheel
          /tmp/wheel/bin/pip install dist/*.whl pytest scipy
          # the tests import cnlplib as installed: from the wheel, with no src/ on the path
          /tmp/wheel/bin/python -m pytest -q -p no:cacheprovider --import-mode=importlib tests
          /tmp/wheel/bin/python -c "import cnlplib, pathlib; assert 'site-packages' in cnlplib.__file__, cnlplib.__file__"
