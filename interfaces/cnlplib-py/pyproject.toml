[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cnlplib"
dynamic = ["version"]
description = "Compiled nonlinear programs (cnlp libraries) as NumPy/CuPy models, and cnlp solvers in-process"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sungho Shin", email = "sushin@mit.edu" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.23"]
keywords = ["nonlinear programming", "optimization", "NLP", "GPU", "MadNLP", "Ipopt", "ExaModels"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]

[project.optional-dependencies]
# evaluation and solves on an NVIDIA GPU (backend="cuda"); [ctk] brings the CUDA headers that
# cupyx.scipy.sparse compiles its kernels against
cuda = ["cupy-cuda12x[ctk]>=13"]
scipy = ["scipy>=1.10"]
test = ["pytest>=7", "pytest-cov", "scipy>=1.10"]

[project.urls]
Homepage = "https://cnlplib.madsuite.org"
Documentation = "https://cnlplib.madsuite.org"
Repository = "https://github.com/madsuite-org/cnlplib"
Issues = "https://github.com/madsuite-org/cnlplib/issues"

[tool.setuptools.dynamic]
version = { attr = "cnlplib.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cnlplib = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
