[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cnlplib"
version = "0.1.0"
license = {file = "LICENSE"}
description = "cnlp libraries (compiled nonlinear programs, cnlp.h) as numpy-backed models"
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.optional-dependencies]
solve = ["h5py"]

[tool.setuptools.packages.find]
where = ["src"]
